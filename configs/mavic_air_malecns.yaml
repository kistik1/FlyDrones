# DJI Mavic Air using the real MaleCNS v1.0 sensorimotor core.
# First validation profile: the calibrated brain may command slow yaw only.
brain:
  source: data/malecns_core2.npz
  lif:
    dt: 1.0
    noise_mv: 0.0
  bias:
    DNg02_L: 8.0
    DNg02_R: 8.0
  record_neurons: 200

decoder:
  readout_file: data/readout_malecns_core2.json
  settle_s: 2.0

safety:
  max_throttle: 0.0
  max_yaw: 0.10
  max_forward: 0.0
  max_lateral: 0.0
  slew_per_s: 0.30
  min_alt_m: 0.4
  max_alt_m: 1.0
  geofence_radius_m: 2.0
  brain_timeout_s: 0.25
  min_battery_pct: 10
  max_flight_s: 180

control:
  hz: 20
  takeoff: false
